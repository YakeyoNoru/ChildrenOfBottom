plugins { id 'com.android.application' }
def gameOrigin = providers.gradleProperty('gameOrigin').getOrElse('https://game.example.com')
if (!(gameOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('gameOrigin must be an HTTPS origin without path or trailing slash')
android {
    namespace 'com.subtrpg.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.subtrpg.game'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.2.0'
        buildConfigField 'String', 'GAME_ORIGIN', '"' + gameOrigin + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
